name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: "Also build the signed release APK"
        type: boolean
        default: false

permissions:
  contents: write

# A new push cancels an in-flight build of an older commit.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          # Explicit: write the cache from main so later runs can read it.
          cache-read-only: false

      - name: Build debug APK
        run: gradle assembleDebug --build-cache

      - name: Build release APK
        if: inputs.release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --build-cache

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          # The installable APK also ships as an asset on the "latest"
          # release below, which is what the phone actually installs from
          # and isn't subject to this quota. This copy is only for pulling a
          # specific commit's build without hunting through releases, so it
          # doesn't need to survive long — the default retention (90 days,
          # unset here previously) is what silently grew this to 357
          # artifacts / ~3.9 GB and tripped the account's storage quota,
          # which fails uploads outright rather than evicting anything.
          retention-days: 7

      # R8's own account of what it did, from app/build/outputs/mapping/:
      # missing_rules.txt (rules R8 wants and cannot infer), seeds.txt (what
      # was kept) and usage.txt (what was removed). Together they answer "what
      # did R8 actually do" without a device or a log fetch.
      #
      # always(), because the run that most needs this is a FAILED one. a9bbf5a
      # died at :app:minifyDebugWithR8 and missing_rules.txt held the exact
      # -dontwarn to add; a step that only runs on success cannot help there.
      #
      # if-no-files-found: ignore, because the directory does not exist at all
      # while isMinifyEnabled is false. A warning on every ordinary build is
      # how people learn to ignore warnings.
      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-debug
          path: app/build/outputs/mapping/
          if-no-files-found: ignore
          # Same reasoning as app-debug above: this is a live-debugging aid
          # for a build that just failed, not something worth keeping for
          # months. Short retention here is what keeps the fix from being
          # temporary.
          retention-days: 7

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            $([ -f app/build/outputs/apk/release/app-release.apk ] && echo app/build/outputs/apk/release/app-release.apk) \
            -t "Latest debug build" -p \
            -n "Auto-built from commit ${{ github.sha }}"
