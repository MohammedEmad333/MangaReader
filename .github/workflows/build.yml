name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: "Also build the signed release APK"
        type: boolean
        default: false

permissions:
  contents: write

# A new push cancels an in-flight build of an older commit.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          # Explicit: write the cache from main so later runs can read it.
          cache-read-only: false

      # Fast JVM logic tests before the APK is built, so a regression in
      # something like chapter-number recognition fails the run here instead of
      # shipping in the "latest" build. These are pure unit tests (src/test) and
      # take seconds; anything needing a device is not run here.
      - name: Run unit tests
        run: gradle testDebugUnitTest --build-cache

      # Every APK published from main must use one persistent signing
      # certificate. GitHub-hosted runners otherwise generate a fresh debug
      # keystore, which makes Android reject the next APK as an update.
      # Pull-request builds deliberately skip this and use the ordinary debug
      # key so forked PRs never need access to repository secrets.
      - name: Prepare stable CI signing key
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Published APK signing requires RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build debug APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --build-cache

      - name: Build release APK
        if: inputs.release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --build-cache

      - name: Upload Cima4u extension artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: serieshub-cima4u-extension
          path: extensions/cima4u/build/outputs/apk/debug/cima4u-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload DramaCafe extension artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: serieshub-dramacafe-extension
          path: extensions/dramacafe/build/outputs/apk/debug/dramacafe-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload WatanFlix extension artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: serieshub-watanflix-extension
          path: extensions/watanflix/build/outputs/apk/debug/watanflix-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        # Non-fatal: this is a convenience copy for pulling a specific commit's
        # build, and it is subject to the account-wide Actions STORAGE quota,
        # which rejects uploads outright when full rather than evicting old
        # ones. The installable APK ships as a release asset below — Releases do
        # NOT count against that quota — so a failed upload here must not take
        # the release down with it. Before this, a full quota failed this step
        # and every step after it was skipped, INCLUDING the release publish.
        continue-on-error: true
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          # Short retention so this can't silently reaccumulate — the default
          # (90 days, unset originally) is what grew this to 357 artifacts /
          # ~3.9 GB and tripped the quota in the first place.
          retention-days: 7

      # R8's own account of what it did, from app/build/outputs/mapping/:
      # missing_rules.txt (rules R8 wants and cannot infer), seeds.txt (what
      # was kept) and usage.txt (what was removed). Together they answer "what
      # did R8 actually do" without a device or a log fetch.
      #
      # always(), because the run that most needs this is a FAILED one. a9bbf5a
      # died at :app:minifyDebugWithR8 and missing_rules.txt held the exact
      # -dontwarn to add; a step that only runs on success cannot help there.
      #
      # if-no-files-found: ignore, because the directory does not exist at all
      # while isMinifyEnabled is false. A warning on every ordinary build is
      # how people learn to ignore warnings.
      - name: Upload R8 mapping
        if: always()
        # Same non-fatal treatment as the APK upload above and for the same
        # reason: a full storage quota must not fail the job or skip the
        # release. always() still tries it on a failed build (the run that most
        # needs the mapping), continue-on-error keeps a rejected upload from
        # turning green into red.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping-debug
          path: app/build/outputs/mapping/
          if-no-files-found: ignore
          retention-days: 7

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.app_version.outputs.name }}"
          debug_asset="Yomu-${version}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$debug_asset"

          extension_asset="serieshub-cima4u-v17.6.apk"
          cp extensions/cima4u/build/outputs/apk/debug/cima4u-debug.apk "$extension_asset"

          dramacafe_asset="serieshub-dramacafe-v17.4.apk"
          cp extensions/dramacafe/build/outputs/apk/debug/dramacafe-debug.apk "$dramacafe_asset"

          watanflix_asset="serieshub-watanflix-v17.5.apk"
          cp extensions/watanflix/build/outputs/apk/debug/watanflix-debug.apk "$watanflix_asset"

          assets=("$debug_asset" "$extension_asset" "$dramacafe_asset" "$watanflix_asset")
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            release_asset="Yomu-${version}-release.apk"
            cp app/build/outputs/apk/release/app-release.apk "$release_asset"
            assets+=("$release_asset")
          fi

          gh release delete latest --cleanup-tag -y || true
          gh release create latest "${assets[@]}" \
            -t "Yomu v${version}" -p \
            -n "Auto-built Yomu v${version} from commit ${{ github.sha }}"
