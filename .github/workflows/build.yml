name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: "Also build the signed release APK"
        type: boolean
        default: false

permissions:
  contents: write

# A new push cancels an in-flight build of an older commit.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          # Explicit: write the cache from main so later runs can read it.
          cache-read-only: false

      # Fast JVM logic tests before the APK is built, so a regression in
      # something like chapter-number recognition fails the run here instead of
      # shipping in the "latest" build. These are pure unit tests (src/test) and
      # take seconds; anything needing a device is not run here.
      - name: Run unit tests
        run: gradle testDebugUnitTest --build-cache

      - name: Build debug APK
        run: gradle assembleDebug --build-cache

      - name: Build release APK
        if: inputs.release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --build-cache

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        # Non-fatal: this is a convenience copy for pulling a specific commit's
        # build, and it is subject to the account-wide Actions STORAGE quota,
        # which rejects uploads outright when full rather than evicting old
        # ones. The installable APK ships as a release asset below — Releases do
        # NOT count against that quota — so a failed upload here must not take
        # the release down with it. Before this, a full quota failed this step
        # and every step after it was skipped, INCLUDING the release publish.
        continue-on-error: true
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          # Short retention so this can't silently reaccumulate — the default
          # (90 days, unset originally) is what grew this to 357 artifacts /
          # ~3.9 GB and tripped the quota in the first place.
          retention-days: 7

      # R8's own account of what it did, from app/build/outputs/mapping/:
      # missing_rules.txt (rules R8 wants and cannot infer), seeds.txt (what
      # was kept) and usage.txt (what was removed). Together they answer "what
      # did R8 actually do" without a device or a log fetch.
      #
      # always(), because the run that most needs this is a FAILED one. a9bbf5a
      # died at :app:minifyDebugWithR8 and missing_rules.txt held the exact
      # -dontwarn to add; a step that only runs on success cannot help there.
      #
      # if-no-files-found: ignore, because the directory does not exist at all
      # while isMinifyEnabled is false. A warning on every ordinary build is
      # how people learn to ignore warnings.
      - name: Upload R8 mapping
        if: always()
        # Same non-fatal treatment as the APK upload above and for the same
        # reason: a full storage quota must not fail the job or skip the
        # release. always() still tries it on a failed build (the run that most
        # needs the mapping), continue-on-error keeps a rejected upload from
        # turning green into red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mapping-debug
          path: app/build/outputs/mapping/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            $([ -f app/build/outputs/apk/release/app-release.apk ] && echo app/build/outputs/apk/release/app-release.apk) \
            -t "Latest debug build" -p \
            -n "Auto-built from commit ${{ github.sha }}"
