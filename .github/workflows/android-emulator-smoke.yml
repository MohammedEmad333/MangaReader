name: Android emulator smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-emulator-smoke.yml"
      - "scripts/android_updates_smoke.py"
      - "scripts/android_emulator_launch.sh"
      - "app/src/androidTest/**"
      - "app/src/main/java/com/mangareader/app/Backup.kt"
      - "app/src/main/java/com/mangareader/app/BackupVerification.kt"
      - "app/src/main/java/com/mangareader/app/ReaderPageModes.kt"
      - "app/src/main/java/com/mangareader/app/ReaderTabletSpreads.kt"
      - "app/src/main/java/com/mangareader/app/ReaderPagePriority.kt"
      - "app/src/main/java/com/mangareader/app/LibraryArrangement.kt"
      - "app/src/main/java/com/mangareader/app/LibraryDerivedState.kt"
      - "app/src/main/java/com/mangareader/app/LibraryHistoryRecency.kt"
      - "app/src/main/java/com/mangareader/app/DownloadsTab.kt"
      - "app/src/main/java/com/mangareader/app/DownloadIndex.kt"
      - "app/src/main/java/com/mangareader/app/DownloadIndexBuilder.kt"
      - "app/src/main/java/com/mangareader/app/DownloadPaths.kt"
      - "app/src/main/java/com/mangareader/app/DownloadedSeriesGrouping.kt"
      - "app/src/main/java/com/mangareader/app/CoverRepair.kt"
      - "app/src/main/java/com/mangareader/app/CoverRepairState.kt"
      - "app/build.gradle.kts"
      - "app/src/main/java/com/mangareader/app/ChapterUpdatesTab.kt"
      - "app/src/main/java/com/mangareader/app/MainBottomNavigation.kt"
      - "app/src/main/java/com/mangareader/app/ChapterUpdateJournal.kt"

permissions:
  contents: read

# A new PR commit supersedes old emulator sessions and conserves CI minutes.
concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.5"

      - name: Build non-minified device-test APK and instrumentation APK
        run: gradle :app:assembleDeviceTest :app:assembleDeviceTestAndroidTest --build-cache

      - name: Verify UI smoke helper
        run: python3 scripts/android_updates_smoke.py --self-test

      - name: Enable KVM acceleration for emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM available and enabled"
          else
            echo "::warning::KVM not available on runner; emulator may be too slow"
          fi

      - name: Boot Android and smoke test install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -camera-front none -memory 3072 -cores 2
          disable-animations: true
          script: |
            YOMU_SMOKE_APK=app/build/outputs/apk/deviceTest/app-deviceTest.apk bash scripts/android_emulator_launch.sh
            gradle :app:connectedDeviceTestAndroidTest --build-cache

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-test-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Updates screen capture
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: updates-screen-capture
          path: smoke-results/updates-screen.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload emulator failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke-diagnostics
          path: smoke-results/
          if-no-files-found: ignore
          retention-days: 7
