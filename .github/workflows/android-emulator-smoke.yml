name: Android emulator smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.5"

      - name: Build debug APK with standard debug signing
        run: gradle :app:assembleDebug --build-cache

      - name: Boot Android and smoke test install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.mangareader.app || true
            adb shell monkey -p com.mangareader.app -c android.intent.category.LAUNCHER 1
            sleep 15
            pid="$(adb shell pidof com.mangareader.app | tr -d '\r')"
            if [ -z "$pid" ]; then
              echo "::error::Yomu process was not running after launcher smoke test."
              adb logcat -d -t 500
              exit 1
            fi
            echo "Yomu process launched successfully (PID $pid)."

            # Verify that the Updates bottom-nav destination is accessible.
            # Read actual accessibility node bounds rather than assuming a
            # screen resolution or fixed navigation coordinates.
            adb shell uiautomator dump /sdcard/yomu-window.xml
            adb pull /sdcard/yomu-window.xml /tmp/yomu-window.xml >/dev/null
            python3 - <<'PY'
            import re
            import xml.etree.ElementTree as ET
            root = ET.parse("/tmp/yomu-window.xml").getroot()
            nodes = [node for node in root.iter("node")
                     if node.attrib.get("text") == "Updates"
                     or node.attrib.get("content-desc") == "Updates"]
            if not nodes:
                raise SystemExit("Updates navigation item is missing from UI hierarchy")
            bounds = nodes[0].attrib.get("bounds", "")
            match = re.fullmatch(r"\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]", bounds)
            if not match:
                raise SystemExit(f"Cannot read Updates navigation bounds: {bounds!r}")
            x1, y1, x2, y2 = map(int, match.groups())
            with open("/tmp/yomu-updates-tap", "w") as output:
                output.write(f"{(x1+x2)//2} {(y1+y2)//2}")
            PY
            read -r tap_x tap_y < /tmp/yomu-updates-tap
            adb shell input tap "$tap_x" "$tap_y"
            sleep 3
            adb shell uiautomator dump /sdcard/yomu-updates.xml
            adb pull /sdcard/yomu-updates.xml /tmp/yomu-updates.xml >/dev/null
            python3 - <<'PY'
            import xml.etree.ElementTree as ET
            root = ET.parse("/tmp/yomu-updates.xml").getroot()
            if not any(node.attrib.get("text") == "Chapter updates"
                       for node in root.iter("node")):
                raise SystemExit("Updates screen did not open after tapping the navigation item")
            print("Verified Updates screen navigation on Android emulator.")
            PY

