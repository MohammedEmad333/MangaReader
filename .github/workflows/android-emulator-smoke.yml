name: Android emulator smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-emulator-smoke.yml"
      - "scripts/android_updates_smoke.py"
      - "scripts/android_emulator_launch.sh"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.5"

      - name: Build debug APK with standard debug signing
        run: gradle :app:assembleDebug --build-cache

      - name: Verify UI smoke helper
        run: python3 scripts/android_updates_smoke.py --self-test

      - name: Boot Android and smoke test install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -camera-front none -memory 3072 -cores 2
          disable-animations: true
          script: bash scripts/android_emulator_launch.sh

      - name: Upload Updates screen capture
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: updates-screen-capture
          path: smoke-results/updates-screen.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload emulator failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke-diagnostics
          path: smoke-results/
          if-no-files-found: ignore
          retention-days: 7
