[versions]
okhttp = "5.5.0"
serialization = "1.9.0"
preference = "1.2.1"

[libraries]
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor" }
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli" }
okhttp-zstd = { module = "com.squareup.okhttp3:okhttp-zstd" }
okhttp-doh = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
serialization-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "serialization" }
androidx-preference = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
