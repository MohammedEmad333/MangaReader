# GitHub's ubuntu-latest runners have 4 CPUs and 16 GB RAM. 2g was starving
# the Kotlin/Compose compiler, which is the slowest part of this build.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Reuse task outputs across CI runs (setup-gradle caches the build-cache dir).
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
kotlin.code.style=official

# compileSdk is 36 and AGP 8.5.2 was tested to 34. The gap is a warning, not an
# incompatibility, and this acknowledges it rather than leaving a build-scan
# warning nobody reads. Raise this alongside compileSdk, or delete it once AGP
# is new enough to have been tested against whatever compileSdk says.
android.suppressUnsupportedCompileSdk=36

# Skip generating BuildConfig/R fields you don't use.
android.nonTransitiveRClass=true
android.nonFinalResIds=true
